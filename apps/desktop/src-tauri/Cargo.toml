[package]
name = "glideframe-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "glideframe_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
glideframe-recorder = { path = "../../../crates/glideframe-recorder" }
